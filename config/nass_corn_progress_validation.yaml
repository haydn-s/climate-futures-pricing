schema_version: 1
protocol_id: nass-corn-progress-v1
locked_on: 2026-10-13

purpose: >-
  Test whether original, point-in-time USDA corn progress and condition releases
  improve dated-contract next-open corn signals beyond prior market controls.
  Failure closes this scheduled-release avenue rather than triggering
  post-result feature or threshold search.

sample:
  source: USDA NASS Crop Progress original ESMIS text releases
  first_release: 2012-04-02
  last_archived_release_at_lock: 2026-10-05
  last_execution_labeled_release_at_lock: 2026-09-28
  release_time: "16:00 America/New_York"
  catalog_items: 515
  corn_bearing_releases: 488
  execution_labeled_decisions: 487
  release_notices: 6
  reports_without_corn_rows: 21
  duplicate_entry_sessions: prohibited
  missing_stages: retain_as_missing_and_impute_inside_training_pipeline

information_boundary:
  first_outer_training_year: 2012
  outer_test_years: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
  candidate_selection_outer_years: [2017, 2018, 2019, 2020, 2021, 2022, 2023]
  final_development_confirmation_years: [2024, 2025]
  untouched_model_specific_holdout_year: 2026
  holdout_used_for_selection_or_gate: false
  note: >-
    2026 prices have appeared in other project studies, so this is a sealed
    specification-specific historical diagnostic, not project-wide independent
    evidence.
  inner_validation_fraction: 0.20
  target_embargo_sessions: 5

execution:
  source: dated LSEG ZC contracts
  controls: same-day settlement when available because it precedes the 4 p.m. release
  entry: first dated session open strictly after release
  holding_sessions_after_entry: 5
  overlap: prohibited
  roll_business_days: 10
  commission_usd_per_contract_side: 2.50
  slippage_ticks_per_contract_side: 1.0
  cost_sensitivity_multipliers: [1.0, 2.0]

feature_sets:
  market_only: market
  condition_plus_market: [market, national_condition]
  progress_plus_market: [market, national_progress]
  all_usda_plus_market: [market, national_condition, national_progress]

models:
  ridge:
    alpha: [0.1, 1.0, 10.0]
    action_rule: predicted_return_exceeds_training_median_cost
  logistic:
    C: [0.1, 1.0, 10.0]
    minimum_probability: [0.55]
  shallow_boosting:
    learning_rate: [0.03, 0.10]
    max_leaf_nodes: [7, 15]
    max_iter: [100]
    action_rule: predicted_return_exceeds_training_median_cost

simple_release_rule:
  score: negative condition_balance_change_1w
  action: >-
    BUY when the good-minus-poor condition balance deteriorates, SELL when it
    improves, and HOLD when unchanged or condition is not reported
  fitted_parameters: none

placebos:
  - shift every USDA feature forward one release within calendar year
  - shift every USDA feature backward one release within calendar year

acceptance_gate:
  minimum_development_trades: 70
  must_improve_on_same_model_market_only_net: true
  must_improve_on_same_model_market_only_sharpe: true
  positive_net_at_base_cost: true
  positive_net_at_double_cost: true
  minimum_positive_outer_folds: 6
  minimum_positive_calendar_years: 6
  minimum_year_block_probability_positive: 0.80
  must_beat_simple_release_rule_net: true
  both_one_release_shift_placebos_must_underperform: true

uncertainty:
  draws: 2000
  seed: 590
  bootstrap_unit: calendar_year

holdout_assessment:
  minimum_trades: 8
  positive_net_at_base_cost: true
  positive_net_at_double_cost: true
  must_improve_on_same_model_market_only_net: true
  must_improve_on_same_model_market_only_sharpe: true
  must_beat_simple_release_rule_net: true

reporting:
  inspect_2026_only_after_development_gate_is_final: true
  orders_authorized: false
  row_level_lseg_data_committed: false
